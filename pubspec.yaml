name: obd_ui_custom
description: Hệ thống tùy chỉnh giao diện OBD
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  reorderables: ^0.6.0
  flutter_svg: ^2.0.9
  syncfusion_flutter_charts: ^28.2.3
  lottie: ^3.1.2                  # ✅ THÊM
  flutter_native_splash: ^2.4.1    # ✅ THÊM


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
# ✅ THÊM KHỐI NÀY Ở CUỐI FILE:
flutter:
  uses-material-design: true   # ← ⚠️ THIẾU DÒNG NÀY → icon thành hình chữ nhật gạch chéo
  assets:
    - assets/splash/